<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AR Customer List</title>
  <link rel="stylesheet" href="vendor-list.css"/>
</head>
<body>
  <div class="page-wrap">
    <h1 class="title">AR Customer List</h1>

    <!-- Toolbar -->
    <section class="card toolbar-card" aria-label="Toolbar">
      <div class="toolbar">
        <div class="field input-wrap">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23 6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25 1.5-1.5L15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
          <input id="searchInput" type="text" placeholder="Search by customer or account…" />
        </div>

        <div class="field select-wrap">
          <select id="statusFilter" aria-label="Compliance filter">
            <option value="ALL">All Statuses</option>
            <option value="COMPLIANT">In Compliance</option>
            <option value="OVERDUE">Overdue</option>
          </select>
        </div>

        <button id="exportBtn" class="btn" type="button" title="Export CSV">Export CSV</button>
        <div class="btn-with-help">
          <button class="help-btn" type="button" title="Help">?</button>
        </div>
      </div>
      <p class="small-hint">Balances are as of the latest transaction date.</p>
    </section>

    <!-- Table -->
    <section class="card table-card" aria-labelledby="tblTitle">
      <h2 id="tblTitle" class="sr-only">AR Customer List table</h2>
      <div class="table-wrap">
        <table class="sheet-table" id="customerTable">
          <thead>
            <tr>
              <th data-key="name" class="sortable">Customer</th>
              <th data-key="accountNumber" class="sortable">Account Number</th>
              <th data-key="balanceOwing" class="num sortable">Balance Owing</th>
              <th data-key="salesYTD" class="num sortable">Sales YTD</th>
              <th data-key="salesQTD" class="num sortable">Sales QTD</th>
              <th data-key="status">Status</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="tblBody"></tbody>
          <tfoot>
            <tr>
              <td class="totals-label" colspan="2">Totals</td>
              <td class="num" id="totalBalance">0.00</td>
              <td class="num" id="totalYTD">0.00</td>
              <td class="num" id="totalQTD">0.00</td>
              <td></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </div>

  <div class="toast-area" id="toastArea"></div>

  <!-- ===== Edit Modal (default hidden) ===== -->
  <div class="modal-backdrop" id="editModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <header class="modal-head">
        <h3 id="editTitle">Edit Customer</h3>
        <button class="modal-close" type="button" title="Close">✖</button>
      </header>
      <div class="modal-body">
        <div class="form-row">
          <label for="mName">Customer</label>
          <input id="mName" type="text"/>
        </div>

        <div class="form-row">
          <label for="mAccount">Account Number</label>
          <input id="mAccount" type="text" readonly/>
        </div>

        <div class="form-row">
          <label for="mBalance">Balance Owing</label>
          <input id="mBalance" type="number" step="0.01" />
        </div>

        <div class="form-row">
          <label for="mYTD">Sales YTD</label>
          <input id="mYTD" type="number" step="0.01" />
        </div>

        <div class="form-row">
          <label for="mQTD">Sales QTD</label>
          <input id="mQTD" type="number" step="0.01" />
        </div>

        <div class="form-row">
          <label for="mStatus">Status</label>
          <select id="mStatus" class="status-select">
            <option value="COMPLIANT">In Compliance</option>
            <option value="OVERDUE">Overdue</option>
          </select>
        </div>
      </div>
      <footer class="modal-actions">
        <button id="modalSave"   class="ok-btn"     type="button">✓</button>
        <button id="modalCancel" class="cancel-btn" type="button">✖</button>
      </footer>
    </div>
  </div>

  <!-- اكسر الكاش لو لسه شايل نسخة قديمة -->
  <script src="vendor-list.js"></script>
</body>
</html>
