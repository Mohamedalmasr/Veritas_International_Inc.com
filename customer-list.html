<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AR Customer List</title>
  <link rel="stylesheet" href="customer-list.css"/>
</head>
<body>
  <div class="page-wrap">
    <h1 class="title">AR Customer List</h1>

    <!-- Toolbar -->
    <section class="card toolbar-card" aria-label="Toolbar">
      <div class="toolbar">
        <div class="field input-wrap">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23 6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25 1.5-1.5L15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
          <input id="searchInput" type="text" placeholder="Search by customer or account…" />
        </div>

        <div class="field select-wrap">
          <select id="statusFilter" aria-label="Compliance filter">
            <option value="ALL">All Statuses</option>
            <option value="COMPLIANT">In Compliance</option>
            <option value="OVERDUE">Overdue</option>
          </select>
        </div>

        <button id="exportBtn" class="btn" type="button" title="Export CSV">Export CSV</button>
        <div class="btn-with-help">
          <button class="help-btn" type="button" title="Help">?</button>
        </div>
      </div>
      <p class="small-hint">Balances are as of the latest transaction date.</p>
    </section>

    <!-- Table -->
    <section class="card table-card" aria-labelledby="tblTitle">
      <h2 id="tblTitle" class="sr-only">AR Customer List table</h2>
      <div class="table-wrap">
        <table class="sheet-table" id="customerTable">
          <thead>
            <tr>
              <th class="action-col" scope="col"><span class="sr-only">Open</span></th>
              <th data-key="name" class="sortable" scope="col">Customer</th>
              <th data-key="accountNumber" class="sortable" scope="col">Account Number</th>
              <th data-key="balanceOwing" class="num sortable" scope="col">Balance Owing</th>
              <th data-key="salesYTD" class="num sortable" scope="col">Sales YTD</th>
              <th data-key="salesQTD" class="num sortable" scope="col">Sales QTD</th>
              <th data-key="status" scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="tblBody"></tbody>
          <tfoot>
            <tr>
              <td class="totals-label" colspan="3">Totals</td>
              <td class="num" id="totalBalance">0.00</td>
              <td class="num" id="totalYTD">0.00</td>
              <td class="num" id="totalQTD">0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </div>

  <div class="toast-area" id="toastArea"></div>
  <script src="customer-list.js"></script>
</body>
</html>
