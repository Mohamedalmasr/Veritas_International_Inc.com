<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>

  <link rel="stylesheet" href="style1.css"/>
  <link rel="stylesheet" href="home1.css"/>
</head>
<body>

  <!-- Top Navbar -->
  <header class="app-header" role="navigation" aria-label="Primary">
    <div class="app-brand">
      <span class="logo" aria-hidden="true"></span>
      <span>ONEklient</span>
    </div>

    <nav class="app-nav" role="tablist" aria-label="Primary modules">
      <a href="home1.html" class="nav-link">Home</a>
      <a href="crm.html" class="nav-link">CRM</a>
      <a href="accounting.html" class="nav-link">Accounting</a>
      <a href="documents.html" class="nav-link">Documents</a>
    </nav>

    <div class="user-area">
      <span class="user-name">Lenzi Aziz: <b>813786944</b></span>
      <button class="mail-btn" aria-label="Open messages">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5L4 8V6l8 5 8-5v2Z"/>
        </svg>
        <span class="badge" aria-label="1 unread">1</span>
      </button>
    </div>
  </header>

  <!-- Tabs bar -->
  <div class="tabs-wrap">
    <div id="tabsBar" class="tabs-bar" role="tablist" aria-label="Open pages">
      <button class="tab active pinned" role="tab" aria-selected="true" data-key="home" id="tab-home">
        <span class="label">Home</span>
      </button>
      <!-- dynamic tabs go here -->
    </div>
  </div>

  <!-- Views container -->
  <main id="tabsViews" class="tabs-views">
    <section id="homeView" class="tab-view active" data-key="home" role="tabpanel" aria-labelledby="tab-home">
      <section class="home-card" aria-labelledby="home-title">
        <header class="home-head">
          <h1 id="home-title" class="home-title">Welcome</h1>
          <p class="home-sub">Pick a module to get started.</p>
        </header>

        <!-- Home tiles grid -->
        <div class="home-grid" id="homeGrid" role="list">
          <!-- First row: CRM, Accounting, Documents, Teams -->
          <a class="home-tile draggable-tile"
             href="crm.html"
             data-tab="crm"
             data-id="crm"
             draggable="true"
             role="listitem"
             aria-grabbed="false">
            <div class="tile-title">CRM</div>
            <div class="tile-meta">Open CRM module</div>
          </a>

          <a class="home-tile draggable-tile"
             href="accounting.html#coa"
             data-tab="accounting"
             data-id="accounting"
             draggable="true"
             role="listitem"
             aria-grabbed="false">
            <div class="tile-title">Accounting</div>
            <div class="tile-meta">Go to Accounting</div>
          </a>

          <a class="home-tile draggable-tile"
             href="documents.html"
             data-tab="documents"
             data-id="documents"
             draggable="true"
             role="listitem"
             aria-grabbed="false">
            <div class="tile-title">Documents</div>
            <div class="tile-meta">Open Documents center</div>
          </a>

          <div class="home-tile draggable-tile"
               draggable="true"
               data-id="teams"
               role="listitem"
               aria-label="Teams"
               aria-grabbed="false"
               tabindex="0">
            <div class="tile-title">Teams</div>
            <div class="tile-meta">Manage members & roles</div>
          </div>

          <!-- Second row: yellow tiles -->
          <a class="home-tile draggable-tile accent-tile service-tile"
             href="services2.html"
             data-tab="services"
             data-id="services"
             draggable="true"
             role="listitem"
             aria-label="Real Estate Brokerage"
             aria-grabbed="false">
            <div class="tile-title">Real Estate Brokerage</div>
          </a>

          <div class="home-tile draggable-tile accent-tile"
               draggable="true"
               data-id="project-mgmt"
               role="listitem"
               aria-label="Project Management"
               aria-grabbed="false"
               tabindex="0">
            <div class="tile-title">Project Management</div>
          </div>

          <div class="home-tile draggable-tile accent-tile"
               draggable="true"
               data-id="property-mgmt"
               role="listitem"
               aria-label="Property Management"
               aria-grabbed="false"
               tabindex="0">
            <div class="tile-title">Property Management</div>
          </div>
        </div>

      </section>
    </section>
  </main>

  <!-- Toast area -->
  <div id="toastArea" class="toast-area" aria-live="assertive" aria-atomic="true"></div>

  <script src="home1.js" defer></script>
</body>
</html>
