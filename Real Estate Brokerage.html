<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real Estate Brokerage</title>

  <link rel="stylesheet" href="Real Estate Brokerage.css"/>
</head>
<body>
  <header class="app-header" role="banner">
    <div class="app-brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-text">Veritas International Inc</span>
    </div>
  </header>

  <main class="page-shell">
    <section class="home-card" aria-labelledby="svc-title">
      <header class="home-head">
        <h1 id="svc-title" class="home-title">Real Estate Brokerage</h1>
        <p class="home-sub">Choose a form to proceed.</p>
      </header>

      <div class="home-grid" role="list">
        <a id="svc-trade" class="home-tile"
           href="sales-record-tabs.html" role="listitem"
           aria-label="Open Sales Record Form">
          <div class="tile-title">Sales Record Form</div>
        </a>

        <a id="svc-trade-record" class="home-tile"
           href="TradeRecord.html" role="listitem"
           aria-label="Open TradeRecord">
          <div class="tile-title">Trade Record</div>
        </a>

        <a id="svc-monthly-checklist" class="home-tile"
           href="Monthly_Trust_Account_Checklist_MonthEndCutOff.html"
           role="listitem"
           aria-label="Open Monthly Trust Account Checklist Month End Cut Off">
          <div class="tile-title">Monthly Trust Account</div>
        </a>
      </div>
    </section>
  </main>

  <script src="Real Estate Brokerage.js" defer></script>
</body>
</html>
