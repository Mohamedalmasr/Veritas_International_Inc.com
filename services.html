<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Services</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="services.css"/>
</head>
<body>

  <div id="global-header"></div>

  <main class="home-wrap">
    <a href="home.html" id="svcBackBtn" class="back-btn" aria-label="Back to previous page">← Back</a>

    <section class="home-card">
      <div class="home-cols">
        <div class="home-left">
          <ul class="link-list" role="list">
            <li class="link-item">
              <a class="link-row" href="group.html">
                <span>Teams</span>
                <i aria-hidden="true">›</i>
              </a>
              <button class="row-help" type="button" aria-label="Help about Teams" title="What is Teams?">?</button>
            </li>

            <li class="link-item">
              <a class="link-row" href="roles.html">
                <span>Roles</span>
                <i aria-hidden="true">›</i>
              </a>
              <button class="row-help" type="button" aria-label="Help about Roles" title="What are Roles?">?</button>
            </li>

            <li class="link-item">
              <a class="link-row" href="pages.html">
                <span>Pages</span>
                <i aria-hidden="true">›</i>
              </a>
              <button class="row-help" type="button" aria-label="Help about Pages" title="What are Pages?">?</button>
            </li>
          </ul>
        </div>

        <div class="home-right">
          <h3 class="help-title">Help</h3>
          <p class="help-text">
            Choose what you want to manage from the left. Use <strong>Groups</strong> to add members
            and set leaders. Use <strong>Roles</strong> to control permissions. Use
            <strong>Pages</strong> to assign and organize website pages per group.
          </p>
        </div>
      </div>
    </section>

  <script src="site.js"></script>
  <script src="services.js"></script>
