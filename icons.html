<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icons Library - ONEklient Solutions Inc.</title>
  <link rel="stylesheet" href="admin-oneklient.css" />
  <link rel="stylesheet" href="icons.css" />
</head>
<body>
  <header class="app-header" role="banner">
    <div class="app-brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-text">ONEklient Solutions Inc.</span>
    </div>
  </header>

  <main class="page-shell">
    <div class="icons-container">
      <div class="page-header">
        <h1 class="page-title">Icons Library</h1>
        <p class="page-description">
          All icons used across the ONEklient platform. Hover over any icon to see its name and purpose.
        </p>
      </div>

      <div class="icons-grid" id="icons-grid">
        <!-- Icons will be populated by JavaScript -->
      </div>
    </div>
  </main>

  <script src="icons.js"></script>
</body>
</html>
