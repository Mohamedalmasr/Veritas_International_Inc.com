<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - ONEklient Solutions Inc.</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="int_navbar.css"/>
  <link rel="stylesheet" href="home.css"/>
  <style>
    .tabs-bar { display: flex; gap: 5px; padding: 10px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { padding: 8px 16px; background: #e2e8f0; border-radius: 8px 8px 0 0; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    .tab.active { background: #fff; border: 1px solid var(--border); border-bottom: none; color: var(--primary); }
    .tab-content { display: none; width: 100%; height: calc(100vh - 180px); border: none; }
    .tab-content.active { display: block; }
  </style>
  <script src="int_navbar.js"></script>
</head>
<body>

  <div id="global-header"></div>

  <main>
    <div id="tabs-container" class="tabs-bar"></div>
    
    <div id="main-content-area">
      <section class="home-card" id="home-dashboard" aria-labelledby="homeTitle">
        <header class="home-head">
          <h1 id="homeTitle" class="home-title">Welcome</h1>
          <p class="home-sub">Pick a module to get started.</p>
        </header>
        <div class="home-grid" id="homeGrid" role="list">
          <div class="home-tile" role="listitem">
            <div class="tile-title">Defaults</div>
            <div class="tile-actions">
              <button class="tile-btn" onclick="openTab('Defaults', 'int_defaults.html')">Open</button>
            </div>
          </div>
          <div class="home-tile" role="listitem">
            <div class="tile-title">Organization</div>
            <div class="tile-actions">
              <button class="tile-btn" onclick="openTab('Organization', 'add_organization.html')">Edit</button>
            </div>
          </div>
<div class="home-tile" role="listitem">
  <div class="tile-title">Individual</div>
  <div class="tile-actions">
    <button class="tile-btn" onclick="openTab('Add Individual', 'add_individual.html')">Add</button>
    <button class="tile-btn tile-btn-secondary" onclick="openTab('Edit Individual', 'edit_individual.html')">Edit</button>
  </div>
</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="site.js"></script>
  <script src="tabs.js"></script>
</body>
</html>
