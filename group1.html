<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Services – Groups</title>

  <link rel="stylesheet" href="style1.css"/>
  <link rel="stylesheet" href="group1.css"/>
</head>
<body class="services">

  <!-- Layout -->
  <main class="svc-wrap svc-transfer">

    <!-- الشمال: Groups + roster + meta -->
    <section class="svc-col left" aria-labelledby="groups-title">

      <!-- Back داخل كارد الجروب -->
      <a href="home1.html" class="back-btn" aria-label="Back to Services">← Back</a>

      <!-- عنوان + زر الإضافة -->
      <div class="col-head">
        <h2 id="groups-title" class="col-title">Groups</h2>
        <button id="addGroupBtn" class="add-btn" type="button"
                aria-haspopup="dialog" aria-controls="addGroupModal"
                title="Add new group" aria-label="Add new group">+</button>
      </div>

      <!-- اختيار الجروب -->
      <button id="groupsToggle" class="dropdown-toggle" aria-expanded="false" aria-controls="groupsPanel">
        <span id="currentGroupLabel">Select group…</span>
        <span class="chev" aria-hidden="true"></span>
      </button>

      <div id="groupsPanel" class="list collapsed" role="listbox" aria-label="Groups list">
        <!-- JS injects -->
      </div>

      <div class="section-gap"></div>
      <div class="roster-head">
        <div class="legend" aria-hidden="true">
          <span class="leader-badge" aria-pressed="true"><span class="dot"></span></span>
          <span class="legend-text">= Leader (click to toggle)</span>
        </div>
      </div>

      <div id="groupRoster" class="roster" aria-label="Group roster">
        <!-- JS injects -->
      </div>

      <div class="meta-form" aria-label="Group information">
        <!-- سطر واحد للكود + الاسم: FIN : Finance -->
        <div class="field">
          <input id="groupCodeName" type="text" disabled aria-label="Group code and name" />
        </div>

        <div class="field">
          <textarea id="groupDesc" rows="4" disabled aria-label="Group description"></textarea>
        </div>
      </div>
    </section>

    <!-- المنتصف: الأسهم -->
    <section class="controls" aria-label="Transfer controls">
      <button id="toGroupBtn" class="big-arrow" title="Move to group" aria-label="Move to group">←</button>
      <button id="toPoolBtn"  class="big-arrow" title="Remove from group" aria-label="Remove from group">→</button>
    </section>

    <!-- اليمين: غير المعيّنين -->
    <section class="svc-col right" aria-labelledby="unassigned-title">
      <h2 id="unassigned-title" class="col-title">Unassigned</h2>

      <div class="box-head">
        <div class="hint muted">Select one or more, then use arrows</div>
      </div>

      <select id="unassignedList" class="listbox" multiple size="16" aria-label="Unassigned people">
        <!-- JS injects -->
      </select>
    </section>
  </main>

  <!-- مودال إضافة جروب (مخفي افتراضيًا) -->
  <div id="addGroupModal" class="modal-overlay" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="addGroupTitle">
      <header class="modal-head">
        <h3 id="addGroupTitle">Add Group</h3>
        <button id="addGroupClose" class="x-btn" type="button" aria-label="Close">×</button>
      </header>

      <form id="addGroupForm" class="modal-body">
        <label class="field">
          <span class="meta-title">Code</span>
          <input id="newGroupCode" type="text" placeholder="e.g., FIN" required maxlength="12" />
        </label>

        <label class="field">
          <span class="meta-title">Name</span>
          <input id="newGroupName" type="text" placeholder="e.g., Finance" required maxlength="64" />
        </label>

        <label class="field">
          <span class="meta-title">Description</span>
          <textarea id="newGroupDesc" rows="4" placeholder="What does this group handle?"></textarea>
        </label>

        <p id="addGroupErr" class="form-error" hidden></p>

        <div class="modal-actions">
          <button id="addGroupCancel" type="button" class="btn ghost">Cancel</button>
          <button id="addGroupSubmit" type="submit" class="btn primary">Add</button>
        </div>
      </form>
    </section>
  </div>

  <script src="group1.js"></script>
</body>
</html>
